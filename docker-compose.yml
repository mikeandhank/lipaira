# Docker Compose for Lipaira — Production
# NOTE: postgres and redis are run as standalone containers, NOT via compose.
#       They are already running on the server. Do NOT add them here.
#
# The API and web containers connect to:
#   DATABASE_URL → postgres:5432 (standalone postgres container)
#   REDIS_HOST=redis → redis:6379 (standalone redis container)
#
# To rebuild after code changes:
#   docker build -t lipaira-api:latest .
#   docker build -t lipaira-web:latest ./lipaira-web
#   docker stop lipaira-api lipaira-web
#   docker rm lipaira-api lipaira-web
#   docker run -d [env vars from .env] --network lipaira-net --name lipaira-api lipaira-api:latest
#   docker run -d --network lipaira-net --name lipaira-web lipaira-web:latest

services:

 traefik:
  image: traefik:v2.10
  container_name: traefik
  ports:
   - "80:80"
   - "443:443"
   - "8080:8080"
  volumes:
   - /var/run/docker.sock:/var/run/docker.sock:ro
   - ./traefik.yml:/etc/traefik/traefik.yml:ro
   - ./lipaira-traefik-dynamic.yml:/etc/traefik/lipaira-traefik-dynamic.yml:ro
  networks:
   - lipaira-net
  restart: unless-stopped

 lipaira-web:
  image: lipaira-web:latest
  container_name: lipaira-web
  networks:
   - lipaira-net
  restart: unless-stopped
  labels:
   - "traefik.enable=true"
   - "traefik.http.routers.web.rule=Host(\"lipaira.ai\") || Host(\"www.lipaira.ai\")"
   - "traefik.http.routers.web.entrypoints=web"
   - "traefik.http.routers.web.priority=5"
   - "traefik.http.services.web.loadbalancer.server.port=80"

 lipaira-api:
  image: lipaira-api:latest
  container_name: lipaira-api
  env_file:
   - .env
  environment:
   - AWS_REGION=us-east-2
   - PYTHONUNBUFFERED=1
   - DATABASE_URL=${DATABASE_URL}
   - REDIS_HOST=redis
   - REDIS_PORT=6379
   - REDIS_PASSWORD=${REDIS_PASSWORD}
   - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
   - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
   - GOOGLE_REDIRECT_URI=https://lipaira.ai/api/auth/google/callback
   - FLASK_SECRET_KEY=${FLASK_SECRET_KEY}
   - INTERNAL_KEY=${INTERNAL_KEY}
   - NEXUSOS_ENV=${NEXUSOS_ENV:-staging}
  networks:
   - lipaira-net
  restart: unless-stopped
  labels:
   - "traefik.enable=true"
   - "traefik.http.routers.api.rule=Host(\"api.lipaira.ai\")"
   - "traefik.http.routers.api.entrypoints=websecure"
   - "traefik.http.routers.api.tls=true"
   - "traefik.http.routers.api.priority=10"
   - "traefik.http.routers.api-catchall.rule=PathPrefix(\"/\")"
   # CRITICAL: These three lines must never be removed.
   # The ALB health check hits port 80 with no Host header.
   # Without the catch-all route Traefik returns 404 and
   # the ALB marks the target unhealthy -> site goes down.
   - "traefik.http.routers.api-catchall.entrypoints=web"
   - "traefik.http.routers.api-catchall.priority=1"
   - "traefik.http.services.api.loadbalancer.server.port=8080"

networks:
 lipaira-net:
  external: true
  name: lipaira-net
