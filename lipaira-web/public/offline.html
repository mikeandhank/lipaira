<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lipaira - Offline</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #eee; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .container { text-align: center; padding: 2rem; }
    h1 { color: #e94560; }
    p { color: #888; }
  </style>
</head>
<body>
  <div class="container">
    <h1>You're Offline</h1>
    <p>Lipaira requires internet to work. Please check your connection.</p>
    <button onclick="window.location.reload()" style="margin-top: 20px; padding: 12px 24px; background: #e94560; color: white; border: none; border-radius: 8px; cursor: pointer;">Try Again</button>
  </div>
</body>
</html>
