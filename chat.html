     1|<!DOCTYPE html>
     2|<html lang="en">
     3|<head>
     4|    <meta charset="UTF-8">
     5|    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     6|    <title>Chat - Lipaira</title>
     7|    <style>
     8|        * { margin: 0; padding: 0; box-sizing: border-box; }
     9|        body { background: #0a0a0f; color: #e4e4e7; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; height: 100vh; display: flex; flex-direction: column; }
    10|        .header { padding: 16px 24px; border-bottom: 1px solid #27272a; display: flex; justify-content: space-between; align-items: center; }

    23|        .input-area { display: flex; gap: 12px; padding: 16px; border-top: 1px solid #27272a; }

    33|<body>
    34|    <div class="header">
    35|        <h1>Lipaira <span>Chat</span></h1>
    36|        <button class="btn btn-small btn-outline" onclick="window.location.href='/'">Dashboard</button>
    37|    </div>
    38|    
    39|    <div class="chat-container">
    40|        <div class="messages" id="messages">
    41|            <div class="message assistant">
    42|                <div class="role">Lipaira</div>
    43|                <div class="text">Hello! Your agent is ready. Send a message to start chatting.</div>
    44|            </div>
    45|        </div>
    46|        
    47|        <div class="input-area">
    48|            <input type="text" id="chat-input" placeholder="Type your message..." onkeypress="if(event.key==='Enter')sendMessage()">
    49|            <button class="btn" onclick="sendMessage()">Send</button>
    50|        </div>
    51|    </div>
    52|    
    53|    <div id="toast" class="toast" style="display:none;"></div>
    54|    
    55|    <script>
    56|        const apiKey = localStorage.getItem('nexus_api_key') || '';
    57|        
    58|        function showToast(text, type = 'success') {
    59|            const toast = document.getElementById('toast');
    60|            toast.textContent = text;
    61|            toast.className = 'toast ' + type;
    62|            toast.style.display = 'block';
    63|            setTimeout(() => toast.style.display = 'none', 3000);
    64|        }
    65|        
    66|        async function sendMessage() {
    67|            const input = document.getElementById('chat-input');
    68|            const message = input.value.trim();
    69|            if (!message) return;
    70|            
    71|            // Add user message
    72|            addMessage('user', message);
    73|            input.value = '';
    74|            
    75|            // Show loading
    76|            showToast('Getting response...', 'loading');
    77|            
    78|            try {
    79|                const res = await fetch('/api/chat', {
    80|                    method: 'POST',
    81|                    headers: {
    82|                        'Content-Type': 'application/json',
    83|                        'X-Nexus-Key': apiKey
    84|                    },
    85|                    body: JSON.stringify({ message })
    86|                });
    87|                
    88|                const data = await res.json();
    89|                
    90|                if (data.error) {
    91|                    showToast(data.error, 'error');
    92|                    addMessage('assistant', 'Error: ' + data.error);
    93|                } else {
    94|                    showToast('Response received', 'success');
    95|                    addMessage('assistant', data.reply || data.content || 'No response');
    96|                }
    97|            } catch(e) {
    98|                showToast('Error: ' + e.message, 'error');
    99|            }
   100|        }
   101|        
   102|        function addMessage(role, text) {
   103|            const container = document.getElementById('messages');
   104|            const div = document.createElement('div');
   105|            div.className = 'message ' + role;
   106|            div.innerHTML = '<div class="role">' + role + '</div><div class="text">' + text + '</div>';
   107|            container.appendChild(div);
   108|            container.scrollTop = container.scrollHeight;
   109|        }
   110|        
   111|        // Check auth
   112|        if (!apiKey) {
   113|            window.location.href = '/';
   114|        }
   115|    </script>
